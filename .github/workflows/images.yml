name: images

# Lints the scripts and the Windows template, builds the Ubuntu 24.04 image
# under KVM on a GitHub-hosted runner, boots the built image once over each
# network mode the host agent uses, and checks that a build whose guest
# provisioning breaks stops fast. QEMU runs with accel=kvm and no TCG
# fallback, so a runner without usable KVM fails. On a release tag the
# publish job pushes the image that passed the boot proof to GHCR.
#
# Lint runs on every event. The jobs that build and boot an image run on a
# pull request or a push to main only when the change touches a file they
# read, or this workflow; a release tag, the weekly run and a dispatch run
# all of them.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Weekly, so that a change outside this repository (an apt mirror, a
  # toolset's download) shows before the next pull request.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every other event's
# run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the build jobs can give a different answer, from the
  # files the change touches. It runs on every event, including the ones
  # that build the full set.
  changed:
    name: changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.inputs.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: select the build jobs
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          set -f
          # Every path the Ubuntu build, its boot proof and the fail-fast
          # cases read, and this workflow, whose steps they are.
          read -r -a inputs <<< "ubuntu-24.04/** toolsets/** guest.env railpack.env fetch-guest.sh mise.toml mise.lock .github/workflows/images.yml"
          run_all() {
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT" in
            pull_request)
              base=$BASE
              ;;
            push)
              [[ $REF != refs/tags/* ]] || run_all "release tag: the full set runs"
              base=$BEFORE
              if [[ ! $base =~ ^[0-9a-f]{40}$ ]] || [[ $base =~ ^0+$ ]]; then
                run_all "first push of the branch: the full set runs"
              fi
              ;;
            *)
              run_all "$EVENT: the full set runs"
              ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags origin "$base" \
              || run_all "the base commit is not available: the full set runs"
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- "${inputs[@]}")
          if [[ -n $changed ]]; then
            printf '%s\n' "$changed" | tee -a "$GITHUB_STEP_SUMMARY"
            run_all "an image input changed: the build jobs run"
          fi
          echo "### no image input changed: the build jobs do not run" >> "$GITHUB_STEP_SUMMARY"
          echo "run=false" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # mise.packer.toml adds Packer to the tools in mise.toml.
      MISE_ENV: packer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pinned tools; mise checks every archive it fetches
      # against mise.lock and mise.packer.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.14
          install_args: --locked
          cache: false

      - name: Tool lockfiles are up to date
        run: |
          mise lock
          (cd toolsets/ci && mise lock)
          git diff --exit-code -- mise.lock mise.packer.lock toolsets/ci/mise.lock

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # The pin scripts a guest publish runs (guest-pin.yml, pin-pr.yml): they
      # write guest.env and deploy/images.env and open the pin pull request,
      # so their fixture tests run on every images run, in seconds.
      - name: the pin scripts' tests
        run: |
          set -euo pipefail
          for file in scripts/*_test.sh; do
            echo "test: ${file}"
            bash "$file"
          done

      # The Windows template is validated only: the image is built by hand
      # on a Linux host with KVM (windows-2025/README.md).
      - name: Validate the Windows template
        env:
          CHECKPOINT_DISABLE: "1"
        run: |
          packer init aws/windows-2025.pkr.hcl
          packer fmt -check -diff aws
          packer validate -var region=eu-west-1 -var toshi_version=ci \
            -var winrm_certificate_pfx=Y2k= -var winrm_certificate_password=ci \
            aws/windows-2025.pkr.hcl

  ubuntu-24-04:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image-sha256: ${{ steps.build.outputs.sha256 }}
      guest-version: ${{ steps.build.outputs.guest-version }}
      sbom-sha256: ${{ steps.sbom.outputs.sha256 }}
    steps:
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable on this runner"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # oras, which pulls the pinned guest helper.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.14
          install_args: --locked
          cache: false

      - name: Install QEMU, ISO tools and passt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils genisoimage passt jq

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/toshi-images/ubuntu-24.04-server-cloudimg-amd64-*.img
            ~/.cache/toshi-images/actions-runner-linux-x64-*.tar.gz
            ~/.cache/toshi-images/go*.linux-amd64.tar.gz
          # Both files pin a cached input: the toolsets' one pins Go.
          key: ubuntu-24.04-${{ hashFiles('ubuntu-24.04/versions.env', 'toolsets/versions.env') }}

      - name: Build the image
        id: build
        run: |
          set -o pipefail
          OUT_DIR="$RUNNER_TEMP/images" ubuntu-24.04/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          {
            echo "sha256=$(sed -n 's/^sha256: //p' "$RUNNER_TEMP/build.log")"
            echo "guest-version=$(sed -n 's/^toshi-guest version: //p' "$RUNNER_TEMP/build.log" | tail -n 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Toolset versions
        run: grep -a '^TOOLSET ' "$RUNNER_TEMP/images/work/serial.log" | tr -d '\r'

      - name: Boot proof over user-mode networking
        env:
          KEEP_SERIAL_LOG: ${{ runner.temp }}/proof-user-serial.log
        run: |
          set -o pipefail
          ubuntu-24.04/boot-proof.sh "$RUNNER_TEMP/images/ubuntu-24.04.qcow2" user | tee "$RUNNER_TEMP/proof-user.log"

      # Confined by Ubuntu's AppArmor profile, passt gives the guest no DHCP
      # lease on the hosted runner. Unconfined, it needs the unprivileged
      # user namespace it sandboxes itself in, which Ubuntu restricts.
      - name: Run passt without its AppArmor profile
        run: |
          sudo apparmor_parser -R /etc/apparmor.d/usr.bin.passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Boot proof over passt
        env:
          KEEP_SERIAL_LOG: ${{ runner.temp }}/proof-passt-serial.log
        run: |
          set -o pipefail
          ubuntu-24.04/boot-proof.sh "$RUNNER_TEMP/images/ubuntu-24.04.qcow2" passt | tee "$RUNNER_TEMP/proof-passt.log"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0

      # Scan the final guest filesystem, not the opaque qcow2 file. Both
      # the NBD export and ext4 mount are read-only, without journal replay.
      - name: SPDX SBOM of the final image
        id: sbom
        run: |
          set -euo pipefail
          device=/dev/nbd0
          mount="$RUNNER_TEMP/image-root"
          sbom="$RUNNER_TEMP/images/ubuntu-24.04.spdx.json"
          sudo modprobe nbd max_part=16
          if [[ -e /sys/block/nbd0/pid ]]; then
            echo "::error::the SBOM's NBD device is already in use"
            exit 1
          fi
          mkdir -p "$mount"
          sudo qemu-nbd --read-only --connect="$device" "$RUNNER_TEMP/images/ubuntu-24.04.qcow2"
          cleanup() {
            status=$?
            trap - EXIT
            if mountpoint -q "$mount"; then
              sudo umount "$mount" || status=1
            fi
            sudo qemu-nbd --disconnect "$device" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          sudo udevadm settle
          # The partition nodes appear when udev handles the device's add
          # events, which can land after settle returns. Until they exist the
          # glob below stays literal and blkid exits 2, so wait for one,
          # bounded, and say so if it never arrives.
          deadline=$((SECONDS + 30))
          until compgen -G "${device}p*" > /dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::${device} has no partition nodes 30 s after qemu-nbd connected"
              exit 1
            fi
            sleep 0.5
          done
          root=$(sudo blkid -t LABEL=cloudimg-rootfs -o device "${device}"p*)
          if [[ ! $root =~ ^/dev/nbd0p[0-9]+$ ]]; then
            echo "::error::the final image has no unique cloudimg-rootfs partition"
            exit 1
          fi
          sudo mount -t ext4 -o ro,noload "$root" "$mount"
          sudo "$(command -v syft)" "dir:${mount}" --source-name ubuntu-24.04.qcow2 -o "spdx-json=${sbom}"
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' "$sbom"
          echo "sha256=$(sha256sum "$sbom" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Record QEMU processes and kernel log
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          {
            echo "== ps -eo pid,stat,wchan:32,cmd (qemu)"
            ps -eo pid,stat,wchan:32,cmd | awk 'NR == 1 || $4 ~ /qemu/'
            echo "== dmesg | tail -n 200"
            sudo -n dmesg | tail -n 200 || true
          } > "$RUNNER_TEMP/failure-record.log" 2>&1

      # Uploaded also when a step fails or the job is cancelled; an upload
      # error must not fail the job.
      - name: Upload build and serial logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-24.04-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/images/work/serial.log
            ${{ runner.temp }}/proof-*.log
            ${{ runner.temp }}/failure-record.log
          if-no-files-found: ignore
          retention-days: 7

      # The built image, kept one day. qemu-img already compressed it.
      - name: Upload the image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-24.04-qcow2
          path: |
            ${{ runner.temp }}/images/ubuntu-24.04.qcow2
            ${{ runner.temp }}/images/ubuntu-24.04.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Proof summary
        run: |
          {
            grep -h '^boot proof (' "$RUNNER_TEMP/proof-user.log" "$RUNNER_TEMP/proof-passt.log"
            grep -E '^(sha256|toshi-guest version|build time):' "$RUNNER_TEMP/build.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Pushes the image that passed the boot proof, from the ubuntu-24-04 job's
  # artifact, with the run's own token, and pulls it back by its digest.
  # It runs no code of the image's build.
  publish:
    needs: ubuntu-24-04
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The run's own token pushes the image; no token is stored.
      packages: write
      id-token: write
    outputs:
      pinned: ${{ steps.publish.outputs.pinned }}
      signing-seconds: ${{ steps.publish.outputs.seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.14
          install_args: --locked aqua:oras-project/oras
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-24.04-qcow2
          path: ${{ runner.temp }}/image

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Resolve the SBOM signing services
        run: ./attest-sbom.sh config "$RUNNER_TEMP/rekor-v2.json"

      # The login goes to a registry config of this step's own, removed on
      # every exit.
      - name: Push, pull back and compare
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          WANT: ${{ needs.ubuntu-24-04.outputs.image-sha256 }}
          GUEST_VERSION: ${{ needs.ubuntu-24-04.outputs.guest-version }}
          SBOM_SHA256: ${{ needs.ubuntu-24-04.outputs.sbom-sha256 }}
          TUF_ROOT: ${{ runner.temp }}/sigstore
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/image"
          if [[ ! $WANT =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the ubuntu-24-04 job gave no image SHA-256: '${WANT}'"
            exit 1
          fi
          echo "${WANT}  ubuntu-24.04.qcow2" | sha256sum -c -
          if [[ ! $SBOM_SHA256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the ubuntu-24-04 job gave no SBOM SHA-256"
            exit 1
          fi
          echo "${SBOM_SHA256}  ubuntu-24.04.spdx.json" | sha256sum -c -
          ref="ghcr.io/${GITHUB_REPOSITORY}/ubuntu-24.04"
          registry_dir=$(mktemp -d -p "$RUNNER_TEMP")
          export DOCKER_CONFIG="$registry_dir"
          registry_config="$registry_dir/config.json"
          trap 'rm -rf "$registry_dir"' EXIT
          printf '%s\n' "$GITHUB_TOKEN" | oras login ghcr.io --registry-config "$registry_config" \
            -u "$GITHUB_ACTOR" --password-stdin
          digest=$(oras push "${ref}:${VERSION}" \
            --registry-config "$registry_config" \
            --artifact-type application/vnd.toshicloud.toshi-image.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.description=Ubuntu 24.04 runner image, toshi-guest ${GUEST_VERSION}" \
            --format 'go-template={{.digest}}' \
            ubuntu-24.04.qcow2:application/octet-stream)
          digest=$(printf '%s' "$digest" | tr -d '[:space:]')
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::oras push printed no manifest digest: '${digest}'"
            exit 1
          fi
          oras pull --no-tty --registry-config "$registry_config" -o "$RUNNER_TEMP/pulled" "${ref}@${digest}"
          echo "${WANT}  $RUNNER_TEMP/pulled/ubuntu-24.04.qcow2" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          # These pins describe the inputs actually selected by this build.
          source ubuntu-24.04/versions.env
          source guest.env
          for file in ubuntu-24.04/versions.env toolsets/versions.env toolsets/ci/mise.lock guest.env railpack.env; do
            jq -n --arg uri "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}#${file}" \
              --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
              '{uri: $uri, digest: {sha256: $sha256}}'
          done | jq -s . > "$RUNNER_TEMP/materials.json"
          jq -n \
            --arg source "git+https://github.com/${GITHUB_REPOSITORY}" --arg commit "$GITHUB_SHA" \
            --arg builder "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --arg invocation "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg version "$VERSION" --arg ubuntu "$UBUNTU_IMAGE_URL" --arg ubuntuDigest "$UBUNTU_IMAGE_SHA256" \
            --arg guest "$TOSHI_GUEST_REF" --arg guestDigest "${TOSHI_GUEST_DIGEST#sha256:}" \
            --arg image "$WANT" --arg sbom "$SBOM_SHA256" \
            --slurpfile materials "$RUNNER_TEMP/materials.json" \
            '{buildDefinition: {buildType: "https://github.com/toshicloud/toshi-images/qcow2/v1",
              externalParameters: {version: $version, platforms: ["linux/amd64"]},
              internalParameters: {syft: "1.52.0", cosign: "3.1.3"},
              resolvedDependencies: ([{uri: $source, digest: {gitCommit: $commit}},
                {uri: $ubuntu, digest: {sha256: $ubuntuDigest}},
                {uri: $guest, digest: {sha256: $guestDigest}},
                {uri: "ubuntu-24.04.qcow2", digest: {sha256: $image}},
                {uri: "ubuntu-24.04.spdx.json", digest: {sha256: $sbom}}] + $materials[0])},
              runDetails: {builder: {id: $builder}, metadata: {invocationId: $invocation}}}' \
            > "$RUNNER_TEMP/image.provenance.json"
          pinned="${ref}@${digest}"
          identity='^https://github.com/toshicloud/toshi-images/\.github/workflows/images\.yml@refs/tags/v.*$'
          SECONDS=0
          trap 'echo "sign/attest/verify: ${SECONDS} s (failed)"' ERR
          cosign sign --yes "$pinned"
          ./attest-sbom.sh predicate "$pinned" "$RUNNER_TEMP/image/ubuntu-24.04.spdx.json" "$identity" \
            "$RUNNER_TEMP/rekor-v2.json" "$RUNNER_TEMP/image.sbom.sigstore.json"
          cosign attest --yes --type slsaprovenance1 --predicate "$RUNNER_TEMP/image.provenance.json" "$pinned"
          cosign verify --timeout 90s \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" "$pinned"
          cosign verify-attestation --timeout 90s --check-claims=true --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" "$pinned"
          echo "seconds=${SECONDS}" >> "$GITHUB_OUTPUT"
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          {
            echo "published and verified ubuntu-24.04 ${VERSION}: ${pinned}"
            echo "ubuntu-24.04.qcow2 sha256 ${WANT}, toshi-guest ${GUEST_VERSION}"
            echo "keyless signature, subject-bound SPDX SBOM and SLSA v1 provenance; sign/attest/verify: ${SECONDS} s"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build-fails-fast:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable on this runner"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/toshi-images/ubuntu-24.04-server-cloudimg-amd64-*.img
            ~/.cache/toshi-images/actions-runner-linux-x64-*.tar.gz
            ~/.cache/toshi-images/go*.linux-amd64.tar.gz
          key: ubuntu-24.04-${{ hashFiles('ubuntu-24.04/versions.env', 'toolsets/versions.env') }}

      - name: Fail fast
        run: |
          # The job is about how fast build.sh stops, not whether it builds:
          # each case breaks the guest's provisioning on purpose and must fail
          # well before its own timeout (status 124), which is well before
          # BUILD_TIMEOUT.
          # The QEMU processes, with the kernel function each waits in, and
          # the kernel's last 200 lines: what a hung case leaves to read.
          record_hang() {
            echo "== ps -eo pid,stat,wchan:32,cmd (qemu)"
            ps -eo pid,stat,wchan:32,cmd | awk 'NR == 1 || $4 ~ /qemu/'
            echo "== dmesg | tail -n 200"
            sudo -n dmesg | tail -n 200 || true
          }
          failed=0
          for case in qemu-exit cloud-init toolset; do
            case_timeout=180
            if [ "$case" = toolset ]; then
              # The 180 s of the other cases, for the same boot, plus the 40 s
              # that retry waits between yq's three tries (10 s and 30 s).
              case_timeout=220
            fi
            rm -rf "${RUNNER_TEMP:?}/$case"
            mkdir -p "$RUNNER_TEMP/$case/tree"
            git archive HEAD | tar -x -C "$RUNNER_TEMP/$case/tree"
            if [ "$case" = toolset ]; then
              # Provisioning goes from loading the download helpers straight
              # to the toolsets: the steps between them download the apt
              # packages and the runner's dependencies, which takes as long
              # as the Ubuntu archive makes it. The only toolset is then yq,
              # with a URL on the guest's own loopback where nothing listens:
              # each of the three tries is refused at once, whatever the
              # network outside the guest does.
              user_data="$RUNNER_TEMP/$case/tree/ubuntu-24.04/user-data"
              sed -i '/^      DEBIAN_FRONTEND=noninteractive apt_get update --error-on=any$/,/^      set -a$/{/^      set -a$/!d}' "$user_data"
              if grep -qE 'apt_get|apt_install|installdependencies' "$user_data" \
                || ! grep -qxF '      set -a' "$user_data" \
                || ! grep -qE '^      for t in [$]TOOLSETS; do run_toolset ' "$user_data"; then
                echo "::error::could not skip the downloads before the toolsets in $case user-data"
                failed=1
                continue
              fi
              printf '%s\n' 'TOOLSETS="yq"' 'YQ_URL="http://127.0.0.1:9/yq"' \
                >> "$RUNNER_TEMP/$case/tree/toolsets/versions.env"
              # build.sh reports the toolset in one of two lines: the first
              # when it reads the serial log after the guest's FAILED marker,
              # the second when it reads between the TOOLSET line and the
              # marker.
              expect='^(guest reported|a toolset failed in the guest \(seen [0-9]+s after boot\):) TOOLSET yq [^ ]+ failed: exit 7: failed: yq from http://127\.0\.0\.1:9/yq \(curl exit 7\)'
            else
              if [ "$case" = qemu-exit ]; then
                replacement='  - [systemctl, poweroff]'
                expect='QEMU exited before TOSHI-IMAGE-BUILD: DONE'
              else
                replacement='  - [false]'
                expect='cloud-init failed in the guest'
              fi
              user_data="$RUNNER_TEMP/$case/tree/ubuntu-24.04/user-data"
              sed -i "s|^  - /usr/local/sbin/toshi-provision\$|$replacement|" "$user_data"
              if ! grep -qxF "$replacement" "$user_data" \
                || grep -qxF '  - /usr/local/sbin/toshi-provision' "$user_data"; then
                echo "::error::could not break provisioning in $case user-data"
                failed=1
                continue
              fi
            fi
            serial="$RUNNER_TEMP/$case/out/work/serial.log"
            watcher=
            if [ "$case" = toolset ]; then
              # The host's clock when the first failed try and when the
              # TOOLSET line reach the serial log, read once a second.
              (
                until grep -aqE 'retry: try 1/3 failed .*http://127\.0\.0\.1:9/yq' "$serial" 2> /dev/null; do sleep 1; done
                date +%s > "$RUNNER_TEMP/$case/first-try"
                until grep -aqE 'TOOLSET yq [^ ]+ failed:' "$serial" 2> /dev/null; do sleep 1; done
                date +%s > "$RUNNER_TEMP/$case/toolset-line"
              ) &
              watcher=$!
            fi
            # 10 s before the timeout the recorder writes hang.log. A case
            # that ends more than 10 s before its timeout stops the recorder
            # before it writes.
            (
              trap 'kill "$sleeper" 2> /dev/null; exit 0' TERM
              sleep "$((case_timeout - 10))" &
              sleeper=$!
              wait "$sleeper"
              record_hang > "$RUNNER_TEMP/$case/hang.log" 2>&1
            ) &
            recorder=$!
            start=$SECONDS
            set +e
            TOSHI_GUEST_BIN=/usr/bin/true OUT_DIR="$RUNNER_TEMP/$case/out" \
              timeout --kill-after=10 "$case_timeout" "$RUNNER_TEMP/$case/tree/ubuntu-24.04/build.sh" \
              > "$RUNNER_TEMP/$case.log" 2>&1
            status=$?
            set -e
            end=$(date +%s)
            elapsed=$((SECONDS - start))
            echo "FAST-FAIL $case exit=$status step_seconds=$elapsed"
            kill "$recorder" 2> /dev/null || true
            wait "$recorder" 2> /dev/null || true
            if [ -n "$watcher" ]; then
              # build.sh can end within the second the watcher sleeps.
              for _ in 1 2 3; do
                if [ -s "$RUNNER_TEMP/$case/toolset-line" ]; then
                  break
                fi
                sleep 1
              done
              kill "$watcher" 2> /dev/null || true
              wait "$watcher" 2> /dev/null || true
            fi
            # 137: build.sh outlived the 10 s after its timeout's TERM.
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error::$case: build.sh did not end within its ${case_timeout} s timeout (exit=$status); $case/hang.log in build-fails-fast-logs has the QEMU processes and kernel log"
              failed=1
              continue
            fi
            if [ "$status" -eq 0 ]; then
              echo "::error::$case: build.sh exit=$status, expected a fast non-zero failure"
              failed=1
            fi
            if ! grep -qaE "$expect" "$RUNNER_TEMP/$case.log"; then
              echo "::error::$case: log has no line that matches '$expect'"
              failed=1
              continue
            fi
            reported=$(grep -aE "$expect" "$RUNNER_TEMP/$case.log" | head -n 1)
            echo "$reported"
            if [ "$case" = toolset ]; then
              # tries_s is the time from the first failed try to the TOOLSET
              # line: the 10 s and 30 s that retry waits between the tries,
              # and the second and third tries.
              # lag_s is the time from the TOOLSET line to build.sh's exit,
              # plus 2 s for the watcher's second and the whole-second clock.
              first=$(cat "$RUNNER_TEMP/$case/first-try" 2> /dev/null || true)
              line=$(cat "$RUNNER_TEMP/$case/toolset-line" 2> /dev/null || true)
              if [ -z "$first" ] || [ -z "$line" ]; then
                echo "::error::$case: the serial log did not show the first failed try and the TOOLSET line"
                failed=1
                continue
              fi
              tries=$((line - first))
              lag=$((end - line + 2))
              echo "FAST-FAIL $case tries_s=$tries lag_s<=$lag"
              if [ "$tries" -gt 50 ]; then
                echo "::error::$case: $tries s from the first failed try to the TOOLSET line, over 50 s"
                failed=1
              fi
              if [ "$lag" -gt 60 ]; then
                echo "::error::$case: detection lag $lag s is over 60 s"
                failed=1
              fi
              continue
            fi
            # The guest's kernel clock starts after QEMU does, so the time
            # build.sh reports minus the last kernel timestamp before the
            # failure (or before power-off) is an upper bound on the lag.
            seen=$(printf '%s\n' "$reported" | sed -nE 's/.*seen ([0-9]+)s after boot.*/\1/p')
            guest=$(tr -d '\r' < "$serial" \
              | sed -E $'s/\e\\[[0-9;]*m//g' \
              | awk -v stop="$([ "$case" = cloud-init ] && echo 'Failed to start cloud-')" '
                  !done && match($0, /^\[ *[0-9]+\.[0-9]+\]/) { t = substr($0, RSTART + 1, RLENGTH - 2) + 0 }
                  stop != "" && index($0, stop) { done = 1 }
                  END { printf "%d", t }')
            if [ -z "$seen" ]; then
              echo "::error::$case: the reported line has no 'seen <n>s after boot'"
              failed=1
              continue
            fi
            lag=$((seen - guest))
            echo "FAST-FAIL $case guest_event_s=$guest detected_s=$seen lag_s<=$lag"
            if [ "$lag" -gt 60 ]; then
              echo "::error::$case: detection lag $lag s is over 60 s"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Record QEMU processes and kernel log
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          {
            echo "== ps -eo pid,stat,wchan:32,cmd (qemu)"
            ps -eo pid,stat,wchan:32,cmd | awk 'NR == 1 || $4 ~ /qemu/'
            echo "== dmesg | tail -n 200"
            sudo -n dmesg | tail -n 200 || true
          } > "$RUNNER_TEMP/failure-record.log" 2>&1

      - name: Upload fail-fast logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-fails-fast-logs
          path: |
            ${{ runner.temp }}/qemu-exit.log
            ${{ runner.temp }}/cloud-init.log
            ${{ runner.temp }}/toolset.log
            ${{ runner.temp }}/*/out/work/serial.log
            ${{ runner.temp }}/*/hang.log
            ${{ runner.temp }}/failure-record.log
          if-no-files-found: ignore
          retention-days: 7
